    fill="none"
  />
  
  <!-- Inner P curve - the distinctive loop -->
  <path 
    d="M24 24 L32 24 C38 24 40 27 40 30 C40 33 38 36 32 36 L24 36"
    stroke="#0D9488"
    stroke-width="5"
    stroke-linecap="round"
