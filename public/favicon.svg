  <!-- Main continuous path: i stem + P loop -->
  <path 
    d="M18 20 L18 48 M18 28 C18 28 18 20 28 20 L35 20 C44 20 44 34 35 34 L28 34 C18 34 18 34 18 42 L18 48"
    stroke="#0D9488"
